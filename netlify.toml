# Static site: publish the repo root as-is, no build step.
[build]
  publish = "."
  command = ""

# Security headers applied to every response.
# CSP is scoped to exactly what the app loads:
#   script-src 'self'            -> only app.js, no inline scripts
#   style-src  ... 'unsafe-inline' -> inline style attributes used by the UI
#   font/style from Google Fonts
#   connect-src api.anthropic.com -> the AI call
# NOTE: if you later point Settings at a custom proxy URL, add that
#       origin to connect-src below or the browser will block it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.anthropic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
