<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1747">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WA Games">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<title>WA Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b class="brand">WA Games</b><span class="hint">Build it here, play it in the chat</span></header>

<main>
<section id="setup">
  <div class="seg" id="modes">
    <label><input type="radio" name="mode" value="pick" checked><span>Pick a Number</span></label>
    <label><input type="radio" name="mode" value="random"><span>Random Round</span></label>
    <label><input type="radio" name="mode" value="mix"><span>Custom Mix</span></label>
  </div>
  <p class="hint" id="modeHelp"></p>

  <div class="card">
    <label for="title">Game title</label>
    <input id="title" maxlength="50" placeholder="Pick a Number">

    <label for="brief">Tell the AI about them <span class="hint">(optional)</span></label>
    <textarea id="brief" rows="3" placeholder="e.g. We met at varsity, she loves Amapiano, keep it flirty but not creepy"></textarea>

    <div class="two">
      <div><label for="aud">Who is it for</label>
        <select id="aud"><option value="anyone">Anyone</option><option value="couple">Couple</option><option value="friends">Friends</option><option value="crush">Crush</option></select></div>
      <div><label for="level">Intensity</label>
        <select id="level"><option value="chill">Chill</option><option value="playful" selected>Playful</option><option value="bold">Bold</option><option value="chaos">Chaos</option></select></div>
    </div>
    <div class="two">
      <div><label for="lang">Language</label>
        <select id="lang"><option value="en">English</option><option value="zu">isiZulu</option><option value="af">Afrikaans</option><option value="mix" selected>Mixed</option></select></div>
      <div><label for="count">Prompts</label>
        <select id="count"><option>10</option><option>15</option><option selected>20</option></select></div>
    </div>

    <div id="typesWrap" hidden>
      <label>Include these types</label>
      <div class="chips" id="types"></div>
    </div>

    <button class="primary go" id="goAI">Generate with AI</button>
    <button class="go" id="goBank">Build from built-in prompts</button>
  </div>
</section>

<section id="board" hidden></section>

<section id="saved" hidden>
  <h2>Saved games</h2>
  <div id="savedList"></div>
</section>

<section id="settings" hidden>
  <h2>Settings</h2>
  <div class="card">
    <label for="number">Their WhatsApp number <span class="hint">(optional, sends straight to their chat)</span></label>
    <input id="number" inputmode="tel" placeholder="e.g. 082 123 4567">
    <label for="key">Anthropic API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-ant-...">
    <label for="model">Model</label>
    <input id="model" placeholder="claude-opus-4-8">
    <label for="endpoint">Proxy URL <span class="hint">(optional, replaces the direct call and the key)</span></label>
    <input id="endpoint" inputmode="url" placeholder="https://your-api.example.com/generate">
    <button class="primary" id="saveSet">Save settings</button>
    <p class="hint">Everything here is stored on this device only. A key in the browser is fine for personal use; use a proxy before sharing the app.</p>
  </div>
</section>
</main>

<dialog id="sheet"></dialog>
<div id="toast" class="toast" role="status"></div>

<nav>
  <button data-v="setup" class="on">New game</button>
  <button data-v="saved">Saved</button>
  <button data-v="settings">Settings</button>
</nav>
<script src="app.js"></script>
</body>
</html>
