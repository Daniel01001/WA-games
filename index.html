<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075E54">
  <meta name="description" content="WhatsApp Game Generator">
  <link rel="manifest" href="manifest.json">
  <title>WA Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">WA Games</div>
    <div class="subtitle">Create games for WhatsApp</div>
  </div>
  <button id="resetBtn" class="icon-btn" title="New game">＋</button>
</header>

<main class="app">
  <section id="setupScreen" class="screen active">
    <div class="hero">
      <span class="hero-icon">🎮</span>
      <div>
        <h1>Create a game</h1>
        <p>Build a quick game, send it on WhatsApp, then score the reply.</p>
      </div>
    </div>

    <label>Category</label>
    <div id="categoryGrid" class="category-grid"></div>

    <div class="card">
      <label for="gameTitle">Game title</label>
      <input id="gameTitle" maxlength="60" value="My WhatsApp Game">

      <div class="two-col">
        <div>
          <label for="questionCount">Questions</label>
          <select id="questionCount">
            <option>5</option>
            <option selected>10</option>
            <option>15</option>
            <option>20</option>
          </select>
        </div>
        <div>
          <label for="difficulty">Style</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="mixed" selected>Mixed</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>

      <label>Question types</label>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="mc" checked> Multiple choice</label>
        <label class="chip"><input type="checkbox" id="open" checked> Open answer</label>
        <label class="chip"><input type="checkbox" id="would"> Would you rather</label>
      </div>

      <label for="customPrompt">Extra instructions <span class="muted">(optional)</span></label>
      <textarea id="customPrompt" rows="3" placeholder="e.g. Make it funny and about our relationship"></textarea>

      <button id="generateBtn" class="primary">Generate game</button>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="screen-head">
      <button class="back" id="backBtn">‹ Back</button>
      <div>
        <h2 id="gameHeading">Game</h2>
        <span id="gameMeta" class="muted"></span>
      </div>
    </div>

    <div id="questions"></div>

    <div class="action-stack">
      <button id="shareBtn" class="whatsapp">◉ Send to WhatsApp</button>
      <button id="copyBtn" class="secondary">Copy questions</button>
      <button id="scoreBtn" class="secondary">Paste answers & score</button>
    </div>
  </section>

  <section id="scoreScreen" class="screen">
    <div class="screen-head">
      <button class="back" id="scoreBackBtn">‹ Back</button>
      <div><h2>Score answers</h2><span class="muted">Paste their WhatsApp reply below</span></div>
    </div>

    <div class="card">
      <textarea id="answerInput" rows="12" placeholder="Example:
1. A
2. Pizza
3. B
4. Paris
5. C"></textarea>
      <button id="evaluateBtn" class="primary">Check answers</button>
    </div>
    <div id="result"></div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
